# Workspace configuration for Blog LSP (TOML)
# All settings except apiKey can be controlled here.

provider = "openai"
model = "gpt-5-nano"
apiBaseUrl = "https://api.openai.com/v1"
maxTokens = 256
temperature = 0.3
numSuggestions = 2
language = "en"      # one of: ja, en
enableStreaming = true
timeoutMs = 50000
reasoningEffort = "minimal" # minimal | low | middle | high
verbosity = "low"            # low | middle | high

[privacy]
scope = "paragraph" # selection | paragraph | document

[style]
prompt = """
Technical blog style guide:
- Audience: software engineers
- Keep explanations concise and accurate
- Provide minimal, runnable code samples
- Avoid unnecessary adjectives
- Write in English
"""

[completion]
maxTextSuggestions = 2
maxHeadingSuggestions = 5
triggerOnHeading = true

[commands]
enableHeadingGeneration = true
enableParagraphCompletion = true
